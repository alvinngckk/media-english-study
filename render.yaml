services:
  - type: web
    name: media-english-study
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import argostranslate.package as p; p.update_package_index(); pkgs=[x for x in p.get_available_packages() if x.from_code=='en' and x.to_code=='zt']; p.install_from_path(pkgs[0].download()) if pkgs else None"
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: "0.0.0.0"
    healthCheckPath: /api/health
