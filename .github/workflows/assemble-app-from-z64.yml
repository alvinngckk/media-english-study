name: assemble-app-from-z64
on:
  push:
    paths:
      - "app-part1.js.z64.c*"
      - "app-part2.js.z64.c*"
      - ".github/workflows/assemble-app-from-z64.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress parts into app.js
        run: |
          python3 - <<'PY'
          import pathlib, base64, zlib
          root = pathlib.Path(".")
          parts = []
          for part in ["app-part1", "app-part2"]:
              chunks = []
              i = 0
              while True:
                  p = root / f"{part}.js.z64.c{i}"
                  if not p.exists():
                      break
                  chunks.append(p.read_text().strip())
                  i += 1
              assert chunks, f"missing chunks for {part}"
              data = zlib.decompress(base64.b64decode("".join(chunks)))
              (root / f"{part}.js").write_bytes(data)
              parts.append(data)
              print(part, len(data), "from", i, "chunks")
          app = b"".join(parts)
          (root / "app.js").write_bytes(app)
          print("app.js", len(app))
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-part1.js app-part2.js
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "chore: assemble app.js from z64 chunks ($(wc -c < app.js) bytes)"
            git push
          fi
